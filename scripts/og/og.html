<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: "PretendardOG"; font-weight: 500; src: url("./fonts/Pretendard-Medium.woff2") format("woff2"); }
  @font-face { font-family: "PretendardOG"; font-weight: 700; src: url("./fonts/Pretendard-Bold.woff2") format("woff2"); }
  @font-face { font-family: "PretendardOG"; font-weight: 800; src: url("./fonts/Pretendard-ExtraBold.woff2") format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: "PretendardOG", sans-serif;
    background: #12352b; color: #f4f1e8;
    position: relative;
  }
  .glow {
    position: absolute; right: -180px; top: -220px; width: 760px; height: 760px; border-radius: 50%;
    background: radial-gradient(circle, rgba(200,242,61,.20), rgba(200,242,61,0) 65%);
  }
  .left { position: absolute; left: 72px; top: 64px; width: 600px; height: 502px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 800; font-size: 40px; letter-spacing: -.01em; }
  .brand img { width: 64px; height: 64px; }
  h1 { margin-top: auto; font-weight: 800; font-size: 82px; line-height: 1.16; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: #c8f23d; }
  .sub { margin-top: 28px; font-weight: 500; font-size: 29px; color: rgba(244,241,232,.78); letter-spacing: -.01em; }
  .tiles { position: absolute; left: 764px; top: 0; width: 370px; height: 630px; }
  .tile {
    position: absolute; width: 170px; height: 170px; border-radius: 38px; overflow: hidden;
    box-shadow: 0 16px 36px rgba(0,0,0,.35), 0 0 0 3px rgba(244,241,232,.14);
  }
  .tile img { width: 100%; height: 100%; display: block; }
  .badge {
    background: #f4f1e8; color: #12352b; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 36px; letter-spacing: -.04em;
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="left">
    <div class="brand"><img src="../../public/favicon.svg" alt="" />Chehok Lab</div>
    <h1>직접 만든 앱과<br /><em>실험</em>을 한곳에</h1>
    <p class="sub">기타 · 모임 · 게임 · 글쓰기 도구 모음</p>
  </div>
  <div class="tiles" id="tiles"></div>
</body>
</html>
